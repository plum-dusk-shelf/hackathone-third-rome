<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>IDE — Манты Edition</title>
    <script src="webui.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>

    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

    <style>
        :root {
            --bg-main: #0f0f0f;        
            --bg-panel: #1a1a1a;       
            --bg-header: #222222;      
            --text-main: #e0e0e0;      
            --text-dim: #777777;       
            --border: #333333;         

            --manti-dough: #f5e6d3;    
            --manti-brown: #8b5a2b;    
            --manti-accent: #d48c4a;   
            --manti-dark: #3a2c24;     

            --terminal-bg: #0a0807;
            --sidebar-width: 200px;
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
                     background: var(--bg-main); color: var(--manti-dough); 
                     font-family: 'Segoe UI', sans-serif; }
        
        #app { display: flex; flex-direction: column; height: 100vh; position: relative; }
        
        #toolbar {
            height: 40px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 10px;
            flex-shrink: 0;
            z-index: 10;
        }

        .toolbar-btn {
            padding: 6px 16px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-run {
            background: rgba(144, 238, 144, 0.2); 
            color: #90ee90;
            border: 1px solid #90ee90;
        }
        .btn-run:hover {
            background: rgba(144, 238, 144, 0.4);
            box-shadow: 0 0 10px rgba(144, 238, 144, 0.3);
        }

        .btn-debug {
            background: rgba(173, 216, 230, 0.2); 
            color: #add8e6;
            border: 1px solid #add8e6;
        }
        .btn-debug:hover {
            background: rgba(173, 216, 230, 0.4);
            box-shadow: 0 0 10px rgba(173, 216, 230, 0.3);
        }

        .debug-actions {
            display: none;
            align-items: center;
            gap: 5px;
        }
        .debug-actions button {
            padding: 4px 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--bg-header);
            color: var(--manti-dough);
            cursor: pointer;
        }
        .debug-actions button:hover { border-color: var(--manti-accent); }
        #variables-toggle {
            display: none;
            padding: 5px 10px;
            border: 1px solid var(--manti-accent);
            border-radius: 5px;
            background: transparent;
            color: var(--manti-dough);
            cursor: pointer;
        }
        #variables-window {
            position: fixed;
            top: 50px;
            right: 12px;
            z-index: 50;
            display: none;
            flex-direction: column;
            width: min(380px, calc(100vw - 24px));
            max-height: min(65vh, 520px);
            background: var(--bg-panel);
            border: 1px solid var(--manti-accent);
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65);
            color: var(--manti-dough);
        }
        #variables-window.visible { display: flex; }
        .variables-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 10px;
            background: var(--bg-header);
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            font-weight: 600;
        }
        #variables-close {
            border: 0;
            background: transparent;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 18px;
        }
        #variables-frames {
            display: flex;
            gap: 5px;
            overflow-x: auto;
            padding: 6px;
            border-bottom: 1px solid var(--border);
        }
        .variables-frame {
            flex: 0 0 auto;
            padding: 4px 7px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: transparent;
            color: var(--text-main);
            cursor: pointer;
            font-size: 11px;
        }
        .variables-frame.active { border-color: var(--manti-accent); color: var(--manti-accent); }
        #variables-content {
            overflow: auto;
            padding: 8px;
            min-height: 48px;
            font: 12px/1.5 Consolas, monospace;
        }
        .variable-scope { margin-bottom: 9px; }
        .variable-scope-title { color: var(--manti-accent); font-weight: 700; margin-bottom: 3px; }
        .variable-row { padding: 2px 4px; border-radius: 3px; overflow-wrap: anywhere; }
        .variable-row.expandable { cursor: pointer; }
        .variable-row.expandable:hover { background: var(--bg-header); }
        .variable-name { color: #add8e6; }
        .variable-type { color: var(--text-dim); }
        .variable-value { color: var(--manti-dough); }
        .variable-children { margin-left: 12px; border-left: 1px solid var(--border); padding-left: 5px; }

        #collapsed-tabs {
            display: flex;
            gap: 5px;
            margin-left: 20px;
            flex-wrap: nowrap;
            overflow-x: auto;
            flex-grow: 1;
            align-items: center;
            height: 100%;
        }

        .collapsed-tab {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: var(--bg-header);
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 12px;
            color: var(--manti-dough);
            cursor: grab;
            user-select: none;
            white-space: nowrap;
            transition: background 0.2s;
        }
        .collapsed-tab:hover {
            background: var(--manti-dark);
            border-color: var(--manti-accent);
        }
        .collapsed-tab .tab-close {
            color: var(--text-dim);
            font-weight: bold;
            margin-left: 5px;
            cursor: pointer;
        }
        .collapsed-tab .tab-close:hover {
            color: #f48771;
        }
        .collapsed-tab.dragging {
            opacity: 0.5;
        }

        #main-area {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        
        #sidebar {
            width: var(--sidebar-width); 
            background: var(--bg-panel); 
            border-right: 1px solid var(--border);
            display: flex; flex-direction: column; padding: 10px; flex-shrink: 0;
            transition: width 0.3s ease, padding 0.3s ease;
            overflow: hidden;
        }
        
        #sidebar.collapsed { width: 0; padding: 10px 0; border-right: none; }

        .sidebar-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 10px; min-width: 150px;
        }
        .sidebar-header h3 { font-size: 12px; text-transform: uppercase; color: var(--text-dim); margin: 0; letter-spacing: 1px; }
        
        #toggle-sidebar-btn {
            background: transparent; border: none; color: var(--manti-dough);
            cursor: pointer; font-size: 16px; padding: 0 5px;
            transition: color 0.2s;
        }
        #toggle-sidebar-btn:hover { color: var(--manti-accent); }

        #expand-sidebar-btn {
            position: absolute; left: 0; top: 50%; transform: translateY(-50%);
            background: var(--bg-header); color: var(--manti-dough);
            border: 1px solid var(--border); border-left: none;
            border-radius: 0 4px 4px 0; padding: 10px 5px;
            cursor: pointer; z-index: 100; display: none;
            transition: background 0.2s;
        }
        #expand-sidebar-btn:hover { background: var(--manti-accent); color: #000; }

        .sidebar-item {
            padding: 8px; margin-bottom: 5px; background: var(--bg-header);
            border-radius: 8px;
            cursor: grab; user-select: none;
            border: 1px solid var(--border);
            color: var(--manti-dough);
            transition: all 0.2s;
            min-width: 180px;
        }
        .sidebar-item:hover { 
            background: var(--manti-accent); 
            border-color: var(--manti-accent); 
            color: #1a1512; 
            font-weight: bold; 
        }

        #workspace {
            flex: 1; display: flex; flex-direction: column;
            background: var(--bg-main); overflow: hidden; padding: 2px;
            min-height: 100px;
        }

        .row {
            display: flex; flex-direction: row;
            flex: 1; min-height: 100px; overflow: hidden;
        }

        .panel {
            display: flex; flex-direction: column;
            border: 1px solid var(--border); margin: 2px;
            background: var(--bg-panel); flex: 1;
            min-width: 150px; min-height: 100px;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            transition: border-color 0.2s, box-shadow 0.2s, opacity 0.2s;
        }

        .panel.active-panel {
            border-color: rgba(245, 230, 211, 0.4);
            box-shadow: 0 0 10px rgba(245, 230, 211, 0.1);
        }

        .panel.panel-small {
            flex: 0.25 1 0%;
            min-width: 80px;
        }

        .panel-header {
            height: 32px; background: var(--bg-header); display: flex; align-items: center;
            padding: 0 12px; font-size: 12px; border-bottom: 1px solid var(--border);
            user-select: none; flex-shrink: 0;
            cursor: grab; color: var(--manti-dough); font-weight: 600;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            transition: background 0.2s;
            justify-content: space-between;
        }

        .panel-title {
            display: flex;
            align-items: center;
        }

        .panel-controls {
            display: flex;
            gap: 5px;
        }

        .panel-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 16px;
            padding: 0 4px;
            line-height: 1;
            transition: color 0.2s;
        }
        .panel-btn:hover {
            color: #fff;
        }
        .panel-btn.close:hover {
            color: #f48771;
        }

        .panel.active-panel .panel-header {
            background: #2a2a2a;
            color: #fff;
        }

        .dirty-dot {
            display: inline-block;
            width: 8px; height: 8px;
            background-color: #ffffff;
            border-radius: 50%;
            margin-left: 8px;
            box-shadow: 0 0 4px rgba(255,255,255,0.5);
            visibility: hidden;
        }
        .dirty-dot.visible { visibility: visible; }

        .panel.dragging { opacity: 0.4; border: 1px dashed var(--manti-accent); }

        .panel-content { flex: 1; overflow: hidden; position: relative; display: flex; flex-direction: column; }
        
        .resizer { background: transparent; position: absolute; z-index: 10; transition: background 0.2s; }
        .resizer:hover, .resizer.active { background: var(--manti-accent); }
        .resizer-h { width: 6px; height: 100%; cursor: col-resize; right: -3px; top: 0; }
        .resizer-v { height: 6px; width: 100%; cursor: row-resize; bottom: -3px; left: 0; }

        .file-tree { padding: 5px; font-size: 13px; user-select: none; overflow: auto; flex: 1; }
        
        .tree-item {
            padding: 2px 5px;
            cursor: pointer;
            border-radius: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            color: var(--manti-dough);
            transition: background 0.15s;
        }
        .tree-item:hover { background: var(--bg-header); }
        
        .tree-item.dir { color: var(--manti-accent); font-weight: bold; }
        
        .tree-arrow {
            display: inline-block;
            width: 14px;
            font-size: 10px;
            margin-right: 4px;
            text-align: center;
            transition: transform 0.1s;
        }
        .tree-item.dir.expanded .tree-arrow {
            transform: rotate(90deg);
        }

        .tree-children {
            margin-left: 15px;
            display: none; 
        }
        .tree-children.expanded {
            display: block;
        }

        .editor-wrapper {
            display: flex;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        .editor-gutter {
            width: 40px;
            background: #151515;
            border-right: 1px solid var(--border);
            font-family: 'Consolas', monospace;
            font-size: 14px;
            line-height: 20px;
            color: var(--text-dim);
            text-align: right;
            padding-top: 10px;
            overflow: hidden;
            user-select: none;
            position: relative;
            flex-shrink: 0;
        }

        .gutter-line {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 5px;
            height: 20px;
            position: relative;
        }
        .gutter-line.current-line { background: rgba(212, 140, 74, 0.35); }

        .breakpoint-dot {
            position: absolute;
            left: 5px;
            width: 10px;
            height: 10px;
            background-color: #e53935;
            border-radius: 50%;
            display: none;
            box-shadow: 0 0 5px rgba(229, 57, 53, 0.8);
        }
        .breakpoint-dot.active {
            display: block;
        }

        .editor-area {
            flex: 1;
            width: 100%;
            height: 100%;
            background: var(--bg-main);
            color: var(--manti-dough);
            border: none;
            resize: none;
            padding: 10px;
            font-family: 'Consolas', monospace;
            font-size: 14px;
            line-height: 20px;
            outline: none;
            white-space: pre;
            overflow: auto;
            tab-size: 4;
        }
        .editor-area::placeholder { color: var(--text-dim); }

        .term-container { width: 100%; height: 100%; padding: 6px; background: var(--terminal-bg); }
        .xterm { height: 100%; }

        .graph-container { width: 100%; height: 100%; }

        .complexity-container { padding: 15px; font-size: 14px; overflow: auto; flex: 1; }
        .complexity-title { font-size: 24px; color: var(--manti-accent); font-weight: bold; margin-bottom: 8px; }
        .complexity-desc { color: var(--manti-dough); line-height: 1.4; }
        .complexity-badge {
            display: inline-block; padding: 4px 8px; background: var(--manti-brown);
            color: #fff; border-radius: 4px; margin-top: 10px; font-weight: bold; font-size: 12px;
        }

        .console-container {
            padding: 10px;
            font-family: 'Consolas', monospace;
            font-size: 12px;
            color: #e8d8c3;
            background: #0a0807;
            overflow: auto;
            flex: 1;
            white-space: pre-wrap;
            line-height: 1.5;
        }

        #workspace.drag-over { background: rgba(212, 140, 74, 0.05); border: 2px dashed var(--manti-accent); }
        .panel.drag-over { border: 1px dashed var(--manti-accent); background: rgba(212, 140, 74, 0.1); }

        /* Модальные окна */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
            opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-window {
            background: var(--manti-dough);
            color: #1a1512;
            border-radius: 12px;
            padding: 20px;
            width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            border: 2px solid var(--manti-accent);
            font-family: 'Segoe UI', sans-serif;
        }
        .modal-window h3 { margin-top: 0; margin-bottom: 15px; color: var(--manti-brown); font-size: 16px; }
        .modal-window p { font-size: 13px; margin-bottom: 15px; line-height: 1.4; color: #1a1512; }

        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
        .modal-btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; transition: background 0.2s; }
        .modal-btn-cancel { background: transparent; color: var(--manti-brown); border: 1px solid var(--manti-brown); }
        .modal-btn-cancel:hover { background: rgba(139, 90, 43, 0.1); }
        .modal-btn-save-current { background: var(--manti-accent); color: #fff; }
        .modal-btn-save-current:hover { background: #e89f5a; }
        .modal-btn-save-all { background: var(--manti-brown); color: #fff; }
        .modal-btn-save-all:hover { background: #a06b38; }

        #notify-details div {
            padding: 4px 8px;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            font-size: 12px;
        }
        #notify-details div:last-child {
            border-bottom: none;
        }

        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--manti-accent); }
    </style>
</head>
<body>

<div id="app">
    <div id="toolbar">
        <button class="toolbar-btn btn-run" onclick="startRun()">Запуск</button>
        <button class="toolbar-btn btn-debug" onclick="startDebug()">Дебаг</button>
        <div class="debug-actions" id="debug-actions">
            <button data-debug-command="continue" onclick="sendDebugCommand('continue')" title="Продолжить (F5)">Продолжить</button>
            <button data-debug-command="next" onclick="sendDebugCommand('next')" title="Шаг с обходом (F10)">Шаг</button>
            <button data-debug-command="stepIn" onclick="sendDebugCommand('stepIn')" title="Шаг с заходом (F11)">Войти</button>
            <button data-debug-command="stepOut" onclick="sendDebugCommand('stepOut')" title="Выйти из метода">Выйти</button>
            <button data-debug-command="pause" onclick="sendDebugCommand('pause')" title="Приостановить">Пауза</button>
            <button data-debug-command="stop" onclick="sendDebugCommand('stop')" title="Остановить">Стоп</button>
        </div>
        <button id="variables-toggle" type="button">Переменные</button>
        <div id="collapsed-tabs"></div>
    </div>

    <div id="main-area">
        <button id="expand-sidebar-btn" title="Развернуть панель">▶</button>

        <div id="sidebar">
            <div class="sidebar-header">
                <h3>Панели</h3>
                <button id="toggle-sidebar-btn" title="Свернуть панель">◀</button>
            </div>
            <div class="sidebar-item" draggable="true" data-type="explorer">Explorer</div>
            <div class="sidebar-item" draggable="true" data-type="editor">Редактор</div>
            <div class="sidebar-item" draggable="true" data-type="terminal">Терминал</div>
            <div class="sidebar-item" draggable="true" data-type="graph">Граф</div>
            <div class="sidebar-item" draggable="true" data-type="complexity">Сложность (Big O)</div>
            <div class="sidebar-item" draggable="true" data-type="console">Консоль</div>
        </div>

        <div id="workspace"></div>
    </div>
</div>

<section id="variables-window" aria-label="Переменные отладчика">
    <div class="variables-header">
        <span>Переменные</span>
        <button id="variables-close" type="button" aria-label="Закрыть окно переменных">×</button>
    </div>
    <div id="variables-frames"></div>
    <div id="variables-content">Переменные появятся при остановке отладчика.</div>
</section>

<!-- Модальное окно сохранения -->
<div class="modal-overlay" id="save-modal">
    <div class="modal-window">
        <h3>Несохраненные изменения</h3>
        <p>Обнаружены изменения в нескольких редакторах. Что вы хотите сделать?</p>
        
        <p style="margin-bottom:5px; font-weight:bold;">Список измененных редакторов:</p>
        <div class="modal-list" id="modal-editor-list"></div>

        <div class="modal-actions">
            <button class="modal-btn modal-btn-cancel" onclick="closeSaveModal()">Отмена</button>
            <button class="modal-btn modal-btn-save-current" onclick="actionSaveCurrent()">Сохранить текущий</button>
            <button class="modal-btn modal-btn-save-all" onclick="actionSaveAll()">Сохранить все</button>
        </div>
    </div>
</div>

<!-- Модальное окно уведомлений и подтверждений -->
<div class="modal-overlay" id="notify-modal">
    <div class="modal-window">
        <h3 id="notify-title">Уведомление</h3>
        <p id="notify-message">...</p>
        <div id="notify-details" style="display:none; background: rgba(0,0,0,0.05); border-radius: 8px; max-height: 150px; overflow-y: auto; margin-bottom: 15px; padding: 5px; border: 1px solid rgba(0,0,0,0.1);"></div>
        <div class="modal-actions">
            <button class="modal-btn modal-btn-cancel" id="notify-cancel-btn" onclick="closeNotifyModal()">Отмена</button>
            <button class="modal-btn modal-btn-save-current" id="notify-ok-btn" onclick="confirmNotifyModal()">ОК</button>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // 1. Состояние и утилиты
    // ==========================================
    const editorStates = new WeakMap(); 
    let currentActiveEditor = null;
    let modalSelectedEditor = null;
    let editorCounter = 0; 
    let selectedEditor = null;
    let javaDebugSocket = null;
    let javaDebugSocketPromise = null;
    let javaDebugMode = null;
    let javaStdinActive = false;
    let javaInputBuffer = '';
    const terminalSessions = new Map();
    const javaOutputBuffers = new Map();
    let activeTerminalId = null;
    let selectedDebugFrame = null;
    let debuggerPaused = false;
    let variablesRequestCounter = 0;
    const pendingVariableRequests = new Map();
    
    let dragSrcPanel = null;
    let dragSrcStyles = null; 

    let collapsedTabsData = []; 
    let pendingOptimize = false;
    // Флаг: только что была оптимизация, не позволяем перезаписывать код
    let justOptimized = false;

    let activePanel = null;
    function setActivePanel(panel) {
        if (activePanel) activePanel.classList.remove('active-panel');
        activePanel = panel;
        if (activePanel) activePanel.classList.add('active-panel');
    }

    document.addEventListener('mousedown', (e) => {
        if (!e.target.closest('.panel')) {
            setActivePanel(null);
        }
    });

    function decodeBase64(str) {
        const binStr = atob(str);
        const bytes = new Uint8Array(binStr.length);
        for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
        return new TextDecoder('utf-8').decode(bytes);
    }

    function ensureConsolePanel() {
        if (!document.querySelector('.console-container') && typeof addPanelToWorkspace === 'function') {
            addPanelToWorkspace('console');
        }
        return document.querySelector('.console-container');
    }

    async function ensureJavaTerminal() {
        let session = activeTerminalId && terminalSessions.get(activeTerminalId);
        if (!session || !session.term.element?.isConnected) {
            session = [...terminalSessions.values()].find(item => item.term.element?.isConnected);
        }
        if (!session) {
            addPanelToWorkspace('terminal');
            session = [...terminalSessions.values()].reverse().find(item => item.term.element?.isConnected);
        }
        if (!session) throw new Error('Не удалось открыть панель терминала.');
        activeTerminalId = session.id;
        await session.ready;
        session.term.focus();
        return session;
    }

    function writeJavaOutput(message) {
        const session = activeTerminalId && terminalSessions.get(activeTerminalId);
        if (!session || !session.term.element?.isConnected) {
            return;
        }

        const category = message.category || 'stdout';
        let buffer = javaOutputBuffers.get(category) || '';
        buffer += message.text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
        const lines = buffer.split('\n');
        buffer = lines.pop();
        lines.forEach(line => {
            const timestamp = new Date().toLocaleTimeString();
            session.term.writeln(`[${timestamp}] [Java/${category}] ${line}`);
        });
        javaOutputBuffers.set(category, buffer);
        if (buffer && !session.outputTimer) {
            session.outputTimer = setTimeout(() => {
                const partial = javaOutputBuffers.get(category) || '';
                if (partial) {
                    const timestamp = new Date().toLocaleTimeString();
                    session.term.writeln(`[${timestamp}] [Java/${category}] ${partial}`);
                    javaOutputBuffers.set(category, '');
                }
                session.outputTimer = null;
            }, 100);
        }
    }

    function sendJavaStdin(session, data) {
        if (!javaDebugSocket || javaDebugSocket.readyState !== WebSocket.OPEN) return false;
        if (data === '\r' || data === '\n') {
            session.term.write('\r\n');
            javaDebugSocket.send(JSON.stringify({ cmd: 'input', text: `${javaInputBuffer}\n` }));
            javaInputBuffer = '';
        } else if (data === '\u007f' || data === '\b') {
            if (javaInputBuffer.length) {
                javaInputBuffer = javaInputBuffer.slice(0, -1);
                session.term.write('\b \b');
            }
        } else if (data === '\u0003') {
            javaInputBuffer = '';
            session.term.write('^C\r\n');
            javaDebugSocket.send(JSON.stringify({ cmd: 'stop' }));
        } else if (!/[\u0000-\u001f\u007f]/.test(data)) {
            javaInputBuffer += data;
            session.term.write(data);
        }
        return true;
    }

    function openSaveModal(triggerEditor, actionCallback) {
        currentActiveEditor = triggerEditor;
        modalSelectedEditor = triggerEditor;
        modalList.innerHTML = '';

        const dirtyEditors = [];
        document.querySelectorAll('.editor-area').forEach(editor => {
            const state = editorStates.get(editor);
            if (state && state.dirty) {
                dirtyEditors.push({ editor, state });
            }
        });

        if (dirtyEditors.length === 0) {
            if (actionCallback) actionCallback();
            return;
        }

        window.pendingSaveAction = actionCallback;

        dirtyEditors.forEach(item => {
            const div = document.createElement('div');
            div.className = 'modal-list-item';
            
            const fileName = item.state.path ? item.state.path.split(/[\\/]/).pop() : "(без файла)";
            div.textContent = `${item.state.editorTitle} — ${fileName}`;
            
            if (item.editor === triggerEditor) div.classList.add('selected');

            div.onclick = () => {
                modalList.querySelectorAll('.modal-list-item').forEach(el => el.classList.remove('selected'));
                div.classList.add('selected');
                modalSelectedEditor = item.editor;
            };

            modalList.appendChild(div);
        });

        modalOverlay.classList.add('active');
    }

    function closeSaveModal() {
        modalOverlay.classList.remove('active');

        modalSelectedEditor = null;
        window.pendingSaveAction = null;

    function actionSaveCurrent() {
        if (modalSelectedEditor) saveEditor(modalSelectedEditor);

    function actionSaveAll() {
        document.querySelectorAll('.editor-area').forEach(editor => {

    window.onFilesLoaded = function(b64Str) {
        const trees = document.querySelectorAll('.file-tree');
        try {
            const data = JSON.parse(decodeBase64(b64Str));
            trees.forEach(tree => {
                if (data.error) { 
                    tree.innerHTML = `<span style="color:var(--manti-accent)">Ошибка: ${data.error}</span>`; 
                    return; 
                }
                tree.innerHTML = '';

                const renderTree = (children, container, depth = 0) => {
                    children.forEach(child => {
                        const itemDiv = document.createElement('div');
                        itemDiv.className = 'tree-item ' + (child.type === 'dir' ? 'dir' : '');
                        itemDiv.style.paddingLeft = (5 + depth * 12) + 'px';

                        const arrow = document.createElement('span');
                        arrow.className = 'tree-arrow';
                        arrow.textContent = child.type === 'dir' ? '▶' : '';
                        
                        const nameSpan = document.createElement('span');
                        nameSpan.textContent = (child.type === 'dir' ? '📁 ' : '📄 ') + child.name;
                        
                        itemDiv.appendChild(arrow);
                        itemDiv.appendChild(nameSpan);
                        container.appendChild(itemDiv);

                        if (child.type === 'dir') {
                            if (child.children && child.children.length > 0) {
                                const childrenContainer = document.createElement('div');
                                childrenContainer.className = 'tree-children';
                                container.appendChild(childrenContainer);
                                
                                renderTree(child.children, childrenContainer, depth + 1);

                                if (depth === 0) {
                                    itemDiv.classList.add('expanded');
                                    childrenContainer.classList.add('expanded');
                                }

                                itemDiv.addEventListener('click', (e) => {
                                    e.stopPropagation();
                                    itemDiv.classList.toggle('expanded');
                                    childrenContainer.classList.toggle('expanded');
                                });
                            } else {
                                itemDiv.style.cursor = 'default';
                                arrow.style.opacity = '0.3';
                            }
                        } else {
                            itemDiv.addEventListener('click', () => {
                                const safePath = btoa(unescape(encodeURIComponent(child.path)));
                                if (typeof webui !== 'undefined') webui.read_file(safePath);
                            });
                        }
                    });
                };

                renderTree(data, tree, 0);
            });
        } catch(e) { trees.forEach(tree => tree.innerHTML = "Ошибка: " + e.message); }
    };

    window.onFileContentLoaded = function(b64Str) {
        try {
            const data = JSON.parse(decodeBase64(b64Str));
            if (data.error) { console.error(data.error); return; }

            // Если только что была оптимизация — не перезаписываем код
            if (justOptimized) {
                justOptimized = false;
                return;
            }

            document.querySelectorAll('.editor-area').forEach(editor => {
                editor.value = data.content;
                
                let state = editorStates.get(editor);
                if (!state) {
                    state = { editorId: '', editorTitle: '' };
                }
                
                state.path = data.path;
                state.originalContent = data.content;
                state.dirty = false;
                
                editorStates.set(editor, state);

                const panel = editor.closest('.panel');
                if (panel) {
                    const titleSpan = panel.querySelector('.panel-title span');
                    if (titleSpan && state.editorTitle) {
                        const fileName = data.path.split(/[\\/]/).pop();
                        titleSpan.textContent = `${state.editorTitle} — ${fileName}`;
                    }

                if (wrapper) {
                    const gutter = wrapper.querySelector('.editor-gutter');
                    if (gutter) updateGutter(editor, gutter);
                }
            });

            refreshAllComplexityPanels();
            if (document.querySelector('.graph-container')) {
                requestGraphForCurrentEditor(false);

        } catch(e) { console.error(e); }
    };
