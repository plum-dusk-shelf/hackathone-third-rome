    function showDebugControls(visible) {
        const controls = document.getElementById('debug-actions');
        if (controls) controls.style.display = visible ? 'flex' : 'none';
        updateDebugControls();
    }

    function updateDebugControls() {
        const controls = document.getElementById('debug-actions');
        if (!controls) return;
        controls.querySelectorAll('[data-debug-command]').forEach(button => {
            const command = button.dataset.debugCommand;
            if (command === 'continue' || command === 'next' || command === 'stepIn' || command === 'stepOut') {
                button.disabled = !debuggerPaused;
            } else if (command === 'pause') {
                button.disabled = debuggerPaused;
            }
        });
    }

    function showVariablesWindow(visible) {
        const panel = document.getElementById('variables-window');
        const toggle = document.getElementById('variables-toggle');
        if (panel) panel.classList.toggle('visible', visible);
        if (toggle) toggle.style.display = javaDebugMode === 'debug' ? 'block' : 'none';
    }

    document.getElementById('variables-toggle').addEventListener('click', () => {
        const panel = document.getElementById('variables-window');
        showVariablesWindow(!panel.classList.contains('visible'));
    });
    document.getElementById('variables-close').addEventListener('click', () => {
        showVariablesWindow(false);
    });

    function clearVariableContent(message) {
        pendingVariableRequests.clear();
        const content = document.getElementById('variables-content');
        const frames = document.getElementById('variables-frames');
        if (content) content.textContent = message;
        if (frames) frames.replaceChildren();
    }

    function requestVariables(ref, target, kind) {
        if (!ref || !javaDebugSocket || javaDebugSocket.readyState !== WebSocket.OPEN) return;
        const requestId = `variables-${++variablesRequestCounter}`;
        pendingVariableRequests.set(requestId, { target, kind });
        javaDebugSocket.send(JSON.stringify({ cmd: 'variables', ref, requestId }));
    }

    function renderVariableItems(target, items) {
        target.replaceChildren();
        if (!items.length) {
            target.textContent = 'Нет инициализированных переменных.';
            return;
        }
        items.forEach(item => {
            const row = document.createElement('div');
            row.className = `variable-row${item.ref ? ' expandable' : ''}`;
            const name = document.createElement('span');
            name.className = 'variable-name';
            name.textContent = item.name;
            const type = document.createElement('span');
            type.className = 'variable-type';
            type.textContent = item.vtype ? ` (${item.vtype})` : '';
            const value = document.createElement('span');
            value.className = 'variable-value';
            value.textContent = ` = ${item.value}`;
            row.append(name, type, value);
            target.appendChild(row);

            if (item.ref) {
                const children = document.createElement('div');
                children.className = 'variable-children';
                children.hidden = true;
                target.appendChild(children);
                row.addEventListener('click', () => {
                    if (!children.hidden) {
                        children.hidden = true;
                        return;
                    }
                    children.hidden = false;
                    if (!children.dataset.loaded) {
                        children.dataset.loaded = 'pending';
                        requestVariables(item.ref, children, 'nested');
                    }
                });
            }
        });
    }

    function renderVariableScopes(message) {
        if (message.frameId !== selectedDebugFrame) return;
        const content = document.getElementById('variables-content');
        if (!content) return;
        content.replaceChildren();
        (message.scopes || []).forEach(scope => {
            const section = document.createElement('section');
            section.className = 'variable-scope';
            const heading = document.createElement('div');
            heading.className = 'variable-scope-title';
            heading.textContent = scope.name;
            const values = document.createElement('div');
            values.textContent = scope.ref ? 'Загрузка…' : 'Нет данных.';
            section.append(heading, values);
            content.appendChild(section);
            if (scope.ref) requestVariables(scope.ref, values, 'scope');
        });
        if (!message.scopes || !message.scopes.length) {
            content.textContent = 'Нет доступных областей видимости.';
        }
    }

    function renderDebugFrames(message) {
        const frames = document.getElementById('variables-frames');
        const content = document.getElementById('variables-content');
        if (!frames || !content) return;
        frames.replaceChildren();
        const available = (message.frames || []).filter(frame => frame.id !== undefined && frame.id !== null);
        if (!available.length) {
            selectedDebugFrame = null;
            content.textContent = 'Нет доступных кадров стека.';
            return;
        }
        available.forEach((frame, index) => {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = `variables-frame${index === 0 ? ' active' : ''}`;
            button.textContent = `${frame.name} — ${frame.line}`;
            button.title = frame.path || frame.name;
            button.addEventListener('click', () => {
                selectedDebugFrame = frame.id;
                frames.querySelectorAll('.variables-frame').forEach(item => item.classList.remove('active'));
                button.classList.add('active');
                pendingVariableRequests.clear();
                content.textContent = 'Загрузка переменных…';
                if (javaDebugSocket && javaDebugSocket.readyState === WebSocket.OPEN) {
                    javaDebugSocket.send(JSON.stringify({ cmd: 'selectFrame', frameId: frame.id }));
                }
            });
            frames.appendChild(button);
        });
        selectedDebugFrame = available[0].id;
    }

    function showDebugLocation(message) {
        const frame = message.frames && message.frames[0];
        if (!frame || !frame.path || !frame.line) return;

        const expectedPath = frame.path.replace(/\\/g, '/').toLowerCase();
        let matchingEditor = null;
        document.querySelectorAll('.editor-area').forEach(editor => {
            const state = editorStates.get(editor);
            const editorPath = state && state.path
                ? state.path.replace(/\\/g, '/').toLowerCase()
                : '';
            if (editorPath === expectedPath || editorPath.endsWith(`/${expectedPath}`)) {
                matchingEditor = editor;
            }
            const gutter = editor.closest('.editor-wrapper')?.querySelector('.editor-gutter');
            gutter?.querySelectorAll('.gutter-line').forEach(line => line.classList.remove('current-line'));
        });
        if (!matchingEditor) return;

        const gutter = matchingEditor.closest('.editor-wrapper')?.querySelector('.editor-gutter');
        const line = gutter?.querySelectorAll('.gutter-line')[frame.line - 1];
        if (line) line.classList.add('current-line');

        const lineStart = matchingEditor.value.split('\n').slice(0, frame.line - 1)
            .reduce((offset, text) => offset + text.length + 1, 0);
        matchingEditor.focus();
        matchingEditor.setSelectionRange(lineStart, lineStart);
        selectedEditor = matchingEditor;
    }

    function appendDebugMessage(message) {
        if (message.type === 'status' && message.text) {
            window.appendLog(`[Java] ${message.text}`);
        } else if (message.type === 'output' && message.text) {
            writeJavaOutput(message);
            const category = message.category || 'stdout';
            const lines = message.text.replace(/\r\n?/g, '\n').split('\n');
            if (lines[lines.length - 1] === '') lines.pop();
            lines.forEach(line => window.appendLog(`[Java/${category}] ${line}`));
        } else if (message.type === 'breakpoints') {
            const verified = (message.items || []).filter(item => item.verified).map(item => item.line);
            window.appendLog(`[Java] Точки останова подтверждены: ${verified.join(', ') || 'нет'}`);
        } else if (message.type === 'started') {
            debuggerPaused = false;
            showDebugControls(javaDebugMode === 'debug');
            window.appendLog('[Java] Процесс запущен.');
        } else if (message.type === 'terminalStarted') {
            javaStdinActive = true;
            javaInputBuffer = '';
            window.appendLog(`[Java] Интерактивный процесс запущен (PID ${message.processId}).`);
        } else if (message.type === 'stopped') {
            const frame = message.frames && message.frames[0];
            debuggerPaused = true;
            updateDebugControls();
            showDebugLocation(message);
            showVariablesWindow(true);
            clearVariableContent('Загрузка переменных…');
            renderDebugFrames(message);
            window.appendLog(frame
                ? `[Java] Пауза: ${frame.path}:${frame.line} (${message.reason || 'остановка'})`
                : `[Java] Пауза: ${message.reason || 'остановка'}`);
        } else if (message.type === 'scopes') {
            if (debuggerPaused) renderVariableScopes(message);
        } else if (message.type === 'variables') {
            const pending = pendingVariableRequests.get(message.requestId);
            if (!pending || !debuggerPaused) return;
            pendingVariableRequests.delete(message.requestId);
            if (message.error) {
                pending.target.textContent = `Не удалось загрузить: ${message.error}`;
            } else {
                if (pending.kind === 'nested') pending.target.dataset.loaded = 'true';
                renderVariableItems(pending.target, message.items || []);
            }
        } else if (message.type === 'continued') {
            debuggerPaused = false;
            updateDebugControls();
            clearVariableContent('Выполнение продолжается. Значения обновятся при следующей остановке.');
            window.appendLog('[Java] Выполнение продолжено.');
        } else if (message.type === 'terminated') {
            debuggerPaused = false;
            updateDebugControls();
            javaStdinActive = false;
            javaInputBuffer = '';
            showDebugControls(false);
            showVariablesWindow(false);
            clearVariableContent('Отладочная сессия завершена.');
            document.querySelectorAll('.gutter-line.current-line')
                .forEach(line => line.classList.remove('current-line'));
            window.appendLog('[Java] Процесс завершён.');
        } else if (message.type === 'commandRejected') {
            debuggerPaused = Boolean(message.paused);
            updateDebugControls();
            window.appendLog(`[Java] ${message.text}`);
        } else if (message.type === 'inputAccepted') {
            window.appendLog(`[Java] ${message.text}`);
        } else if (message.type === 'error' && message.text) {
            window.appendLog(`[Java] Ошибка: ${message.text}`);
            showInfo('Ошибка Java', message.text);
        } else if (message.text) {
            window.appendLog(`[Java] ${message.text}`);
        }
    }

    function sendDebugCommand(command) {
        if (!javaDebugSocket || javaDebugSocket.readyState !== WebSocket.OPEN) {
            showInfo('Отладчик недоступен', 'Нет активного соединения с Java debug-сервером.');
            return;
        }
        if (['continue', 'next', 'stepIn', 'stepOut'].includes(command) && !debuggerPaused) return;
        if (command === 'pause' && debuggerPaused) return;
        javaDebugSocket.send(JSON.stringify({ cmd: command }));
        if (['continue', 'next', 'stepIn', 'stepOut'].includes(command)) {
            debuggerPaused = false;
            updateDebugControls();
        }
        window.appendLog(`[Java] Команда: ${command}`);
    }

    function connectJavaDebugServer() {
        if (javaDebugSocket && javaDebugSocket.readyState === WebSocket.OPEN) {
            return Promise.resolve(javaDebugSocket);
        }
        if (javaDebugSocketPromise) return javaDebugSocketPromise;

        javaDebugSocketPromise = new Promise((resolve, reject) => {
            const socket = new WebSocket('ws://127.0.0.1:8086/debug/ws');
            javaDebugSocket = socket;
            let connected = false;
            socket.onmessage = (event) => {
                try {
                    const message = JSON.parse(event.data);
                    appendDebugMessage(message);
                } catch (error) {
                    window.appendLog(`[Java] Некорректный ответ сервера: ${error.message}`);
                }
            };
            socket.onopen = () => {
                connected = true;
                resolve(socket);
            };
            socket.onerror = () => reject(new Error('Не удалось подключиться к Java debug-серверу.'));
            socket.onclose = () => {
                if (!connected) reject(new Error('Java debug-сервер закрыл соединение до запуска.'));
                if (javaDebugSocket === socket) javaDebugSocket = null;
                javaDebugSocketPromise = null;
            };
        }).catch((error) => {
            javaDebugSocketPromise = null;
            throw error;
        });
        return javaDebugSocketPromise;
    }

    async function startJava(mode) {
        ensureConsolePanel();
        const editor = getSelectedEditor();
        const state = editor && editorStates.get(editor);
        if (!editor || !state || !state.path) {
            showInfo('Нет Java-файла', 'Откройте .java-файл в редакторе перед запуском.');
            return;
        }
        if (!state.path.toLowerCase().endsWith('.java')) {
            showInfo('Не Java-файл', 'Для запуска и отладки выберите файл с расширением .java.');
            return;
        }

        try {
            javaDebugMode = mode;
            debuggerPaused = false;
            updateDebugControls();
            const terminal = await ensureJavaTerminal();
            terminal.term.clear();
            terminal.term.writeln(`Java ${mode === 'debug' ? 'debug' : 'run'}: ${state.path}`);
            terminal.term.writeln('При вводе на breakpoint нажмите «Продолжить», чтобы программа обработала строку.');
            terminal.term.writeln('Ввод программы: печатайте здесь и нажмите Enter.');
            javaOutputBuffers.clear();
            javaStdinActive = false;
            javaInputBuffer = '';
            showVariablesWindow(false);
            clearVariableContent('Переменные появятся при остановке отладчика.');
            const variablesToggle = document.getElementById('variables-toggle');
            if (variablesToggle) variablesToggle.style.display = mode === 'debug' ? 'block' : 'none';
            showDebugControls(false);
            window.appendLog(`[Java] Подготовка: ${mode === 'debug' ? 'отладка' : 'запуск'} ${state.path}`);
            const baseUrl = 'http://127.0.0.1:8086/debug';
            const saveResponse = await fetch(`${baseUrl}/api/file`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ path: state.path, text: editor.value })
            });
            const saveData = await saveResponse.json();
            if (!saveResponse.ok) {
                throw new Error(saveData.detail || 'Не удалось сохранить Java-файл.');
            }

            const mainResponse = await fetch(
                `${baseUrl}/api/main-class?path=${encodeURIComponent(state.path)}`
            );
            const mainData = await mainResponse.json();
            if (!mainResponse.ok) {
                throw new Error(mainData.detail || 'Не удалось определить главный Java-класс.');
            }

            const socket = await connectJavaDebugServer();
            const breakpoints = {};
            if (mode === 'debug') {
                const gutter = editor.closest('.editor-wrapper')?.querySelector('.editor-gutter');
                const lines = [];
                gutter?.querySelectorAll('.gutter-line').forEach((line, index) => {
                    if (line.querySelector('.breakpoint-dot.active')) lines.push(index + 1);
                });
                if (lines.length) breakpoints[mainData.path] = lines;
            }

            socket.send(JSON.stringify({
                cmd: 'start',
                mainClass: mainData.path,
                breakpoints
            }));
            window.appendLog(`[Java] ${mode === 'debug' ? 'Отладка' : 'Запуск'}: ${mainData.fqcn}`);
        } catch (error) {
            window.appendLog(`[Java] Ошибка: ${error.message}`);
            showInfo('Не удалось запустить Java', error.message);
            showDebugControls(false);
        }
    }

    window.onFileSaved = function(b64Str) {
        try {
            const data = JSON.parse(decodeBase64(b64Str));
            if (data.error) { showInfo("Ошибка сохранения", data.error); return; }

            document.querySelectorAll('.editor-area').forEach(editor => {
                const state = editorStates.get(editor);
                if (state && state.path === data.path) {
                    state.originalContent = editor.value;
                    state.dirty = false;
                    
                    const panel = editor.closest('.panel');
                    if (panel) {
                        const dot = panel.querySelector('.dirty-dot');
                        if (dot) dot.classList.remove('visible');
                    }
                }
            });
        } catch(e) { console.error(e); }
    };

    function requestGraphForCurrentEditor(showMessages = true) {
        const editors = document.querySelectorAll('.editor-area');
        if (editors.length === 0) {
            if (showMessages) {
                showInfo('Нет редакторов', 'Откройте файл в панели Explorer, чтобы построить граф.');
            }
            return false;
        }

        const code = editors[editors.length - 1].value;
        if (!code.trim()) {
            if (showMessages) {
                showInfo('Редактор пуст', 'Откройте файл или добавьте Java-код в редактор.');
            }
            return false;
        }

        if (typeof webui === 'undefined' || !webui.parse_java) {
            if (showMessages) {
                showInfo('WebUI недоступен', 'Не удалось связаться с обработчиком парсинга Java.');
            }
            return false;
        }

        const b64Code = btoa(unescape(encodeURIComponent(code)));
        webui.parse_java(b64Code);
        return true;
    }

    window.onGraphLoaded = function(b64Str) {
        try {
            const data = JSON.parse(decodeBase64(b64Str));
            document.querySelectorAll('.graph-container').forEach(container => {
                container.innerHTML = '';
                if (data.error) {
                    const error = document.createElement('div');
                    error.style.cssText = 'color:red; padding:10px;';
                    error.textContent = data.error;
                    container.appendChild(error);
                    return;
                }
                if (!Array.isArray(data.nodes) || !Array.isArray(data.edges)) {
                    container.textContent = 'Парсер вернул некорректный граф.';
                    return;
                }
                
                new vis.Network(container, {
                    nodes: new vis.DataSet(data.nodes),
                    edges: new vis.DataSet(data.edges)
                }, {
                    nodes: { borderWidth: 2, color: { background: '#222222', border: '#d48c4a' }, font: { color: '#f5e6d3' } },
                    edges: { color: '#777777', smooth: true },
                    physics: { enabled: true }
                });
            });

            if (pendingOptimize) {
                pendingOptimize = false;
                if (data.error || !Array.isArray(data.nodes) || !Array.isArray(data.edges)) {
                    return;
                }
                const editors = document.querySelectorAll('.editor-area');
                if (editors.length === 0) {
                    showInfo('Нет редакторов', 'Откройте файл в панели Explorer, чтобы использовать эту функцию.');
                    return;
                }
                const code = editors[editors.length - 1].value;
                const payload = JSON.stringify({ code: code, graph: data });
                const b64 = btoa(unescape(encodeURIComponent(payload)));
                if (typeof webui !== 'undefined' && webui.optimize_graph) {
                    webui.optimize_graph(b64);
                }
            }
        } catch(e) { console.error(e); }
    };

    window.onComplexityAnalyzed = function(b64Str) {
        try {
            const data = JSON.parse(decodeBase64(b64Str));
            
            document.querySelectorAll('.complexity-container').forEach(container => {
                if (data.error) {
                    container.innerHTML = `<div style="color:red">Ошибка: ${data.error}</div>`;
                    return;
                }

                container.innerHTML = `
                    <div class="complexity-title">${data.complexity}</div>
                    <div class="complexity-desc">${data.description}</div>
                    <div class="complexity-badge">Макс. вложенность: ${data.max_depth}</div>
                `;
            });
        } catch(e) {
            console.error("Ошибка анализа сложности:", e);
        }
    };

    window.onGraphOptimized = function(b64Str) {
        try {
            const data = JSON.parse(decodeBase64(b64Str));
            if (data.error) {
                showInfo('Ошибка оптимизации', data.error);
                return;
            }

            // Включаем флаг, чтобы read_file не перезаписал новый код
            justOptimized = true;

            // 1. Обновляем код в редакторе и сохраняем его в исходный файл
            document.querySelectorAll('.editor-area').forEach(editor => {
                const state = editorStates.get(editor);
                if (state && state.path) {
                    editor.value = data.new_code;
                    state.originalContent = data.new_code;
                    state.dirty = false;
                    
                    const panel = editor.closest('.panel');
                    if (panel) {
                        const dot = panel.querySelector('.dirty-dot');
                        if (dot) dot.classList.remove('visible');
                    }
                    const wrapper = editor.closest('.editor-wrapper');
                    if (wrapper) {
                        const gutter = wrapper.querySelector('.editor-gutter');
                        if (gutter) updateGutter(editor, gutter);
                    }

                    // Сохраняем оптимизированный код в ИСХОДНЫЙ файл
                    const payload = JSON.stringify({
                        path: state.path,
                        content: data.new_code
                    });
                    if (typeof webui !== 'undefined' && webui.save_file) {
                        webui.save_file(payload);
                    }
                }
            });

            // 2. Перерисовываем граф
            document.querySelectorAll('.graph-container').forEach(container => {
                container.innerHTML = '';
                if (data.optimized_graph && data.optimized_graph.nodes) {
                    new vis.Network(container, {
                        nodes: new vis.DataSet(data.optimized_graph.nodes),
                        edges: new vis.DataSet(data.optimized_graph.edges)
                    }, {
                        nodes: { borderWidth: 2, color: { background: '#222222', border: '#d48c4a' }, font: { color: '#f5e6d3' } },
                        edges: { color: '#777777', smooth: true },
                        physics: { enabled: true }
                    });
                }
            });

            // 3. Показываем модальное окно с отчётом
            const changed = data.changed_methods || [];
            if (changed.length > 0) {
                showNotifyModal(
                    'Оптимизация завершена',
                    'Исходный файл был изменён. Изменённые методы:',
                    {
                        details: changed,
                        confirmText: 'Принять',
                        cancelText: 'Отмена',
                        onConfirm: () => {
                            // Всё уже применено и сохранено
                        }
                    }
                );
            } else {
                showInfo('Оптимизация завершена', 'Модель не нашла методов для оптимизации.');
            }

        } catch(e) {
            console.error(e);
            showInfo('Ошибка', 'Ошибка парсинга ответа оптимизации.');
        }
    };

    function refreshAllComplexityPanels() {
        const editors = document.querySelectorAll('.editor-area');
        if (editors.length === 0) return;

        let targetEditor = editors[editors.length - 1];
        const code = targetEditor.value;

        if (!code.trim()) return;

        const b64Code = btoa(unescape(encodeURIComponent(code)));
        if (typeof webui !== 'undefined' && webui.analyze_complexity) {
            webui.analyze_complexity(b64Code);
        }
    }

    // ==========================================
    // 5. Сворачивание Sidebar
    // ==========================================
    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('toggle-sidebar-btn');
    const expandBtn = document.getElementById('expand-sidebar-btn');

    toggleBtn.addEventListener('click', () => {
        sidebar.classList.add('collapsed');
        expandBtn.style.display = 'block';
    });

    expandBtn.addEventListener('click', () => {
        sidebar.classList.remove('collapsed');
        expandBtn.style.display = 'none';
    });

    // ==========================================
    // 6. Drag & Drop из Sidebar
    // ==========================================
    document.querySelectorAll('.sidebar-item').forEach(item => {
        item.addEventListener('click', () => {
            addPanelToWorkspace(item.dataset.type);
        });

        item.addEventListener('dragstart', (e) => {
            e.dataTransfer.setData('application/x-sidebar-type', item.dataset.type);
            e.dataTransfer.effectAllowed = 'copy';
        });
    });

    const workspace = document.getElementById('workspace');

    workspace.addEventListener('dragover', (e) => {
        if (e.dataTransfer.types.includes('application/x-sidebar-type') || 
            e.dataTransfer.types.includes('application/x-collapsed-tab')) {
            e.preventDefault();
            workspace.classList.add('drag-over');
        }
    });

    workspace.addEventListener('dragleave', (e) => {
        if (e.target === workspace) workspace.classList.remove('drag-over');
    });

    workspace.addEventListener('drop', (e) => {
        workspace.classList.remove('drag-over');
        
        const type = e.dataTransfer.getData('application/x-sidebar-type');
        if (type) {
            e.preventDefault();
            addPanelToWorkspace(type);
            return;
        }

        const collapsedId = e.dataTransfer.getData('application/x-collapsed-tab');
        if (collapsedId) {
            e.preventDefault();
            restoreCollapsedTab(collapsedId);
        }
    });

    let termCounter = 0;

    function addPanelToWorkspace(type) {
        let row = workspace.lastElementChild;
        if (!row || row.children.length >= 2) {
            row = document.createElement('div');
            row.className = 'row';
            workspace.appendChild(row);
        }
        row.appendChild(createPanelElement(type));
    }

    // ==========================================
    // 7. Логика сворачивания и закрытия
    // ==========================================
    const collapsedTabsContainer = document.getElementById('collapsed-tabs');

    function collapsePanel(panel) {
        const header = panel.querySelector('.panel-header');
        const titleText = header.querySelector('.panel-title span').textContent;
        
        let type = 'unknown';
        if (panel.querySelector('.file-tree')) type = 'explorer';
        else if (panel.querySelector('.editor-area')) type = 'editor';
        else if (panel.querySelector('.term-container')) type = 'terminal';
        else if (panel.querySelector('.graph-container')) type = 'graph';
        else if (panel.querySelector('.complexity-container')) type = 'complexity';
        else if (panel.querySelector('.console-container')) type = 'console';

        const tabId = 'tab-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
        
        let savedEditorState = null;
        if (type === 'editor') {
            const editor = panel.querySelector('.editor-area');
            if (editor) {
                savedEditorState = editorStates.get(editor);
            }
        }

        const tabData = {
            id: tabId,
            type: type,
            title: titleText,
            savedEditorState: savedEditorState
        };
        collapsedTabsData.push(tabData);

        const tabEl = document.createElement('div');
        tabEl.className = 'collapsed-tab';
        tabEl.draggable = true;
        tabEl.dataset.tabId = tabId;

        let icon = '📄';
        if (type === 'explorer') icon = '📁';
        else if (type === 'terminal') icon = '⌨️';
        else if (type === 'graph') icon = '🕸️';
        else if (type === 'complexity') icon = '📊';
        else if (type === 'console') icon = '💻';

        tabEl.innerHTML = `<span>${icon} ${titleText}</span>`;
        
        const closeBtn = document.createElement('span');
        closeBtn.className = 'tab-close';
        closeBtn.textContent = '×';
        closeBtn.onclick = (e) => {
            e.stopPropagation();
            removeCollapsedTab(tabId, true);
        };
        tabEl.appendChild(closeBtn);

        tabEl.addEventListener('click', () => {
            restoreCollapsedTab(tabId);
        });

        tabEl.addEventListener('dragstart', (e) => {
            e.dataTransfer.setData('application/x-collapsed-tab', tabId);
            e.dataTransfer.effectAllowed = 'move';
            tabEl.classList.add('dragging');
        });
        tabEl.addEventListener('dragend', () => {
            tabEl.classList.remove('dragging');
        });

        collapsedTabsContainer.appendChild(tabEl);
        panel.remove();
        cleanupEmptyRows();
    }

    function restoreCollapsedTab(tabId) {
        const tabIndex = collapsedTabsData.findIndex(t => t.id === tabId);
        if (tabIndex === -1) return;

        const tabData = collapsedTabsData[tabIndex];

        const newPanel = createPanelElement(tabData.type);

        if (tabData.title) {
            const titleSpan = newPanel.querySelector('.panel-title span');
            if (titleSpan) titleSpan.textContent = tabData.title;
        }

        if (tabData.type === 'editor' && tabData.savedEditorState) {
            const editor = newPanel.querySelector('.editor-area');
            if (editor) {
                editorStates.set(editor, tabData.savedEditorState);
                
                if (tabData.savedEditorState.dirty) {
                    const dot = newPanel.querySelector('.dirty-dot');
                    if (dot) dot.classList.add('visible');
                }

                if (tabData.savedEditorState.path) {
                    const safePath = btoa(unescape(encodeURIComponent(tabData.savedEditorState.path)));
                    if (typeof webui !== 'undefined') webui.read_file(safePath);
                }
            }
        }

        let row = workspace.lastElementChild;
        if (!row || row.children.length >= 2) {
            row = document.createElement('div');
            row.className = 'row';
            workspace.appendChild(row);
        }
        row.appendChild(newPanel);

        collapsedTabsData.splice(tabIndex, 1);
        const tabEl = collapsedTabsContainer.querySelector(`[data-tab-id="${tabId}"]`);
        if (tabEl) tabEl.remove();
    }

    function removeCollapsedTab(tabId, askForSave) {
        const tabIndex = collapsedTabsData.findIndex(t => t.id === tabId);
        if (tabIndex === -1) return;

        const tabData = collapsedTabsData[tabIndex];

        const doRemove = () => {
            collapsedTabsData.splice(tabIndex, 1);
            const tabEl = collapsedTabsContainer.querySelector(`[data-tab-id="${tabId}"]`);
            if (tabEl) tabEl.remove();
        };

        if (tabData.type === 'editor' && tabData.savedEditorState && tabData.savedEditorState.dirty) {
            let dirtyCount = 0;
            document.querySelectorAll('.editor-area').forEach(editor => {
                const state = editorStates.get(editor);
                if (state && state.dirty) dirtyCount++;
            });

            collapsedTabsData.forEach(t => {
                if (t.type === 'editor' && t.savedEditorState && t.savedEditorState.dirty) {
                    dirtyCount++;
                }
            });

            if (dirtyCount > 1) {
                openSaveModal(null, doRemove);
            } else {
                showConfirm(
                    'Несохранённые изменения',
                    'Файл имеет несохраненные изменения. Закрыть без сохранения?',
                    () => { doRemove(); }
                );
            }
        } else {
            doRemove();
        }
    }

    function closePanel(panel) {
        const type = (() => {
            if (panel.querySelector('.file-tree')) return 'explorer';
            if (panel.querySelector('.editor-area')) return 'editor';
            if (panel.querySelector('.term-container')) return 'terminal';
            if (panel.querySelector('.graph-container')) return 'graph';
            if (panel.querySelector('.complexity-container')) return 'complexity';
            if (panel.querySelector('.console-container')) return 'console';
            return 'unknown';
        })();

        const doClose = () => {
            panel.remove();
            cleanupEmptyRows();
        };

        if (type === 'editor') {
            const editor = panel.querySelector('.editor-area');
            const state = editorStates.get(editor);
            
            if (state && state.dirty) {
                let dirtyCount = 0;
                document.querySelectorAll('.editor-area').forEach(e => {
                    const s = editorStates.get(e);
                    if (s && s.dirty) dirtyCount++;
                });
                collapsedTabsData.forEach(t => {
                    if (t.type === 'editor' && t.savedEditorState && t.savedEditorState.dirty) dirtyCount++;
                });

                if (dirtyCount > 1) {
                    openSaveModal(editor, doClose);
                } else {
                    showConfirm(
                        'Несохранённые изменения',
                        'Файл имеет несохраненные изменения. Закрыть без сохранения?',
                        () => { doClose(); }
                    );
                }
            } else {
                doClose();
            }
        } else {
            doClose();
        }
    }

    function cleanupEmptyRows() {
        const rows = document.querySelectorAll('.row');
        rows.forEach(row => {
            if (row.children.length === 0) {
                row.remove();
            }
        });
    }

    // ==========================================
    // 8. Создание панели
    // ==========================================
    function createPanelElement(type) {
        const panel = document.createElement('div');
        panel.className = 'panel';
        
        if (type === 'complexity') {
            panel.classList.add('panel-small');
        }

        const header = document.createElement('div');
        header.className = 'panel-header';
        header.draggable = true;

        const titleContainer = document.createElement('div');
        titleContainer.className = 'panel-title';
        
        const headerTitle = document.createElement('span');
        headerTitle.textContent = 'Panel';

        const dirtyDot = document.createElement('span');
        dirtyDot.className = 'dirty-dot';
        dirtyDot.title = 'Есть несохраненные изменения';

        titleContainer.appendChild(headerTitle);
        titleContainer.appendChild(dirtyDot);

        const controls = document.createElement('div');
        controls.className = 'panel-controls';

        const collapseBtn = document.createElement('button');
        collapseBtn.className = 'panel-btn';
        collapseBtn.innerHTML = '−';
        collapseBtn.title = 'Свернуть';
        collapseBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            collapsePanel(panel);
        });

        const closeBtn = document.createElement('button');
        closeBtn.className = 'panel-btn close';
        closeBtn.innerHTML = '×';
        closeBtn.title = 'Закрыть';
        closeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            closePanel(panel);
        });

        controls.appendChild(collapseBtn);
        controls.appendChild(closeBtn);

        header.appendChild(titleContainer);
        header.appendChild(controls);
        
        const content = document.createElement('div');
        content.className = 'panel-content';

        const resizerH = document.createElement('div');
        resizerH.className = 'resizer resizer-h';
        makeResizableH(panel, resizerH);

        const resizerV = document.createElement('div');
        resizerV.className = 'resizer resizer-v';
        makeResizableV(panel, resizerV);

        panel.appendChild(header);
        panel.appendChild(content);
        panel.appendChild(resizerH);
        panel.appendChild(resizerV);

        panel.addEventListener('mousedown', () => {
            setActivePanel(panel);
        });

        // === Наполнение ===
        if (type === 'explorer') {
            headerTitle.textContent = 'Explorer';
            content.innerHTML = '<div class="file-tree">Загрузка файлов...</div>';
            if (typeof webui !== 'undefined' && webui.get_files) webui.get_files({});
        } else if (type === 'editor') {
            editorCounter++;
            const editorTitle = `Редактор ${editorCounter}`;
            headerTitle.textContent = `${editorTitle}`;

            const wrapper = document.createElement('div');
            wrapper.className = 'editor-wrapper';
            
            const gutter = document.createElement('div');
            gutter.className = 'editor-gutter';
            
            const textarea = document.createElement('textarea');
            textarea.className = 'editor-area';
            textarea.placeholder = 'Выберите файл в Explorer...';
            textarea.spellcheck = false;

            wrapper.appendChild(gutter);
            wrapper.appendChild(textarea);
            content.appendChild(wrapper);

            updateGutter(textarea, gutter);

            editorStates.set(textarea, { 
                path: null, 
                originalContent: '', 
                dirty: false,
                editorId: editorCounter,
                editorTitle: editorTitle
            });

            textarea.addEventListener('scroll', () => {
                gutter.scrollTop = textarea.scrollTop;
            });
            textarea.addEventListener('focus', () => {
                selectedEditor = textarea;
            });
            textarea.addEventListener('mousedown', () => {
                selectedEditor = textarea;
            });

            textarea.addEventListener('input', () => {
                updateGutter(textarea, gutter);

                const state = editorStates.get(textarea);
                if (!state) return; 

                const isChanged = (textarea.value !== state.originalContent);
                state.dirty = isChanged;
                
                if (isChanged) {
                    dirtyDot.classList.add('visible');
                } else {
                    dirtyDot.classList.remove('visible');
                }
            });

            gutter.addEventListener('dblclick', (e) => {
                const rect = gutter.getBoundingClientRect();
                const y = e.clientY - rect.top + gutter.scrollTop - 10;
                const lineIndex = Math.floor(y / 20);
                const lines = gutter.querySelectorAll('.gutter-line');
                
                if (lines[lineIndex]) {
                    const dot = lines[lineIndex].querySelector('.breakpoint-dot');
                    if (dot) {
                        dot.classList.toggle('active');
                    }
                }
            });

            textarea.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
                    e.preventDefault();
                    
                    const state = editorStates.get(textarea);
                    if (!state || !state.path) {
                        console.warn("Файл не выбран, сохранять некуда.");
                        return;
                    }

                    let dirtyCount = 0;
                    document.querySelectorAll('.editor-area').forEach(ed => {
                        const s = editorStates.get(ed);
                        if (s && s.dirty) dirtyCount++;
                    });
                    collapsedTabsData.forEach(t => {
                        if (t.type === 'editor' && t.savedEditorState && t.savedEditorState.dirty) dirtyCount++;
                    });

                    if (dirtyCount > 1) {
                        openSaveModal(textarea);
                    } else {
                        saveEditor(textarea);
                    }
                }
            });

        } else if (type === 'terminal') {
            termCounter++;
            const id = 'term-' + termCounter;
            headerTitle.textContent = 'Терминал ' + termCounter;
            const termDiv = document.createElement('div');
            termDiv.className = 'term-container';
            termDiv.id = 'pane-' + id;
            content.appendChild(termDiv);

            const term = new Terminal({
                fontFamily: 'Cascadia Code, Consolas, monospace',
                fontSize: 14, cursorBlink: true, convertEol: false,
                scrollback: 10000,
                theme: { background: '#0a0807', foreground: '#e8d8c3', cursor: '#d48c4a' },
            });
            const fit = new FitAddon.FitAddon();
            term.loadAddon(fit);
            term.open(termDiv);
            setTimeout(() => fit.fit(), 100);

            let resolveTerminalReady;
            let rejectTerminalReady;
            const terminalSession = {
                id,
                term,
                ws: null,
                outputTimer: null,
                ready: new Promise((resolve, reject) => {
                    resolveTerminalReady = resolve;
                    rejectTerminalReady = reject;
                })
            };
            terminalSessions.set(id, terminalSession);
            activeTerminalId = id;

            setTimeout(() => {
                const ws = new WebSocket(`ws://127.0.0.1:8086/ws/${id}`);
                terminalSession.ws = ws;
                ws.onopen = () => {
                    term.writeln("Соединение установлено!\r\n");
                    resolveTerminalReady(terminalSession);
                };
                ws.onmessage = (event) => term.write(event.data);
                ws.onerror = () => {
                    term.writeln("\r\n\x1b[31mОШИБКА WEB-SOCKET\x1b[0m");
                    rejectTerminalReady(new Error('Не удалось подключить терминал.'));
                };
                ws.onclose = () => {
                    if (!javaStdinActive && terminalSessions.get(id) === terminalSession) {
                        terminalSessions.delete(id);
                    }
                };
                term.onData(data => {
                    if (javaStdinActive && activeTerminalId === id) {
                        sendJavaStdin(terminalSession, data);
                    } else if (ws.readyState === WebSocket.OPEN) {
                        ws.send(data);
                    }
                });
            }, 500);

            window.addEventListener('resize', () => fit.fit());
            panel.addEventListener('mouseup', () => fit.fit());

        } else if (type === 'graph') {
            headerTitle.textContent = 'Граф';
            content.innerHTML = '<div class="graph-container"></div>';
            
            const parseBtn = document.createElement('button');
            parseBtn.textContent = 'Из кода';
            parseBtn.style.cssText = 'margin-left:10px; padding:2px 6px; font-size:10px; cursor:pointer; background:transparent; border:1px solid var(--manti-accent); color:var(--manti-accent); border-radius:4px;';
            parseBtn.onclick = () => requestGraphForCurrentEditor();
            header.appendChild(parseBtn);

            const optimizeBtn = document.createElement('button');
            optimizeBtn.textContent = 'Оптимизировать';
            optimizeBtn.style.cssText = 'margin-left:6px; padding:2px 6px; font-size:10px; cursor:pointer; background:transparent; border:1px solid #90ee90; color:#90ee90; border-radius:4px;';
            optimizeBtn.onclick = () => {
                const editors = document.querySelectorAll('.editor-area');
                if (editors.length === 0) {
                    showInfo('Нет редакторов', 'Откройте файл в панели Explorer, чтобы использовать эту функцию.');
                    return;
                }
                const code = editors[editors.length - 1].value;
                if (!code.trim()) {
                    showInfo('Редактор пуст', 'В редакторе нет кода. Откройте файл или напишите код.');
                    return;
                }

                pendingOptimize = true;
                if (!requestGraphForCurrentEditor()) pendingOptimize = false;
            };
            header.appendChild(optimizeBtn);

            if (!requestGraphForCurrentEditor(false)) {
                content.querySelector('.graph-container').textContent =
                    'Откройте Java-файл в редакторе и нажмите «Из кода».';
            }
            
        } else if (type === 'complexity') {
            headerTitle.textContent = 'Сложность';
            content.innerHTML = '<div class="complexity-container">Ожидание анализа...</div>';
            
            const analyze = () => {
                const editors = document.querySelectorAll('.editor-area');
                if (editors.length === 0) {
                    content.querySelector('.complexity-container').innerHTML = '<div style="color:orange">Нет открытых редакторов.</div>';
                    return;
                }
                
                let targetEditor = editors[editors.length - 1];
                const code = targetEditor.value;
                
                if (!code.trim()) {
                    content.querySelector('.complexity-container').innerHTML = '<div style="color:gray">Редактор пуст.</div>';
                    return;
                }

                const b64Code = btoa(unescape(encodeURIComponent(code)));
                if (typeof webui !== 'undefined' && webui.analyze_complexity) {
                    webui.analyze_complexity(b64Code);
                }
            };

            setTimeout(analyze, 500);
            
            const refreshBtn = document.createElement('button');
            refreshBtn.textContent = 'Обновить';
            refreshBtn.style.marginLeft = '10px';
            refreshBtn.style.background = 'transparent';
            refreshBtn.style.border = '1px solid var(--manti-accent)';
            refreshBtn.style.borderRadius = '4px';
            refreshBtn.style.padding = '2px 6px';
            refreshBtn.style.cursor = 'pointer';
            refreshBtn.style.color = 'var(--manti-accent)';
            refreshBtn.style.fontSize = '10px';
            refreshBtn.onclick = analyze;
            header.appendChild(refreshBtn);
        } else if (type === 'console') {
            headerTitle.textContent = 'Консоль';
            content.innerHTML = '<div class="console-container"></div>';
        }

        // ==========================================
        // DRAG & DROP С СОХРАНЕНИЕМ РАЗМЕРОВ
        // ==========================================
        header.addEventListener('dragstart', (e) => {
            dragSrcPanel = panel;
            dragSrcStyles = {
                width: panel.style.width,
                height: panel.style.height,
                flex: panel.style.flex
            };
            
            panel.classList.add('dragging');
            e.dataTransfer.setData('application/x-panel-swap', '1');
            e.dataTransfer.effectAllowed = 'move';
        });

        header.addEventListener('dragend', () => {
            panel.classList.remove('dragging');
            dragSrcPanel = null;
            dragSrcStyles = null;
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('drag-over'));
        });

        panel.addEventListener('dragover', (e) => {
            if (dragSrcPanel && dragSrcPanel !== panel) {
                e.preventDefault();
                e.stopPropagation();
                panel.classList.add('drag-over');
            }
        });

        panel.addEventListener('dragleave', (e) => {
            panel.classList.remove('drag-over');
        });

        panel.addEventListener('drop', (e) => {
            if (dragSrcPanel && dragSrcPanel !== panel) {
                e.preventDefault();
                e.stopPropagation();
                panel.classList.remove('drag-over');
                
                swapPanels(dragSrcPanel, panel, dragSrcStyles);
                
                dragSrcPanel = null;
                dragSrcStyles = null;
            }
        });

        return panel;
    }

    function swapPanels(panelA, panelB, stylesA) {
        const parentA = panelA.parentNode;
        const parentB = panelB.parentNode;

        const stylesB = {
            width: panelB.style.width,
            height: panelB.style.height,
            flex: panelB.style.flex
        };

        if (parentA === parentB) {
            const marker = document.createElement('span');
            parentA.insertBefore(marker, panelA);
            parentA.insertBefore(panelA, panelB);
            parentA.insertBefore(panelB, marker);
            marker.remove();
        } else {
            const markerA = document.createElement('span');
            const markerB = document.createElement('span');
            parentA.insertBefore(markerA, panelA);
            parentB.insertBefore(markerB, panelB);
            parentA.insertBefore(panelB, markerA);
            parentB.insertBefore(panelA, markerB);
            markerA.remove();
            markerB.remove();
        }

        if (stylesA) {
            panelB.style.width = stylesA.width;
            panelB.style.height = stylesA.height;
            panelB.style.flex = stylesA.flex;
        } else {
            panelB.style.width = '';
            panelB.style.height = '';
            panelB.style.flex = '';
        }

        if (stylesB) {
            panelA.style.width = stylesB.width;
            panelA.style.height = stylesB.height;
            panelA.style.flex = stylesB.flex;
        } else {
            panelA.style.width = '';
            panelA.style.height = '';
            panelA.style.flex = '';
        }

        window.dispatchEvent(new Event('resize'));
    }

    function updateGutter(textarea, gutter) {
        const text = textarea.value;
        const linesCount = text.split('\n').length;
        
        const activeBreakpoints = [];
        const currentLines = gutter.querySelectorAll('.gutter-line');
        currentLines.forEach((line, index) => {
            const dot = line.querySelector('.breakpoint-dot');
            if (dot && dot.classList.contains('active')) {
                activeBreakpoints.push(index);
            }
        });

        gutter.innerHTML = '';
        
        for (let i = 0; i < linesCount; i++) {
            const lineDiv = document.createElement('div');
            lineDiv.className = 'gutter-line';
            
            const dot = document.createElement('div');
            dot.className = 'breakpoint-dot';
            if (activeBreakpoints.includes(i)) {
                dot.classList.add('active');
            }
            
            lineDiv.appendChild(dot);
            lineDiv.appendChild(document.createTextNode(i + 1));
            
            gutter.appendChild(lineDiv);
        }
        
        gutter.scrollTop = textarea.scrollTop;
    }

    function makeResizableH(panel, resizer) {
        resizer.addEventListener('mousedown', (e) => {
            e.preventDefault();
            resizer.classList.add('active');
            const startX = e.clientX;
            const startWidth = panel.offsetWidth;

            const onMouseMove = (ev) => {
                const dx = ev.clientX - startX;
                panel.style.flex = 'none';
                panel.style.width = Math.max(150, startWidth + dx) + 'px';
            };

            const onMouseUp = () => {
                resizer.classList.remove('active');
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
            };

            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        });
    }

    function makeResizableV(panel, resizer) {
        resizer.addEventListener('mousedown', (e) => {
            e.preventDefault();
            resizer.classList.add('active');
            const startY = e.clientY;
            const startHeight = panel.offsetHeight;

            const onMouseMove = (ev) => {
                const dy = ev.clientY - startY;
                panel.style.flex = 'none';
                panel.style.height = Math.max(100, startHeight + dy) + 'px';
            };

            const onMouseUp = () => {
                resizer.classList.remove('active');
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
            };

            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        });
    }

    function startRun() {
        startJava('run');
    }

    function startDebug() {
        startJava('debug');
    }
</script>
